<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ config.APP_NAME }}</title>
    <meta name="description" content="{{ config.APP_DESCRIPTION }}">
    <meta name="author" content="{{ config.APP_NAME }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ asset('img/sealbook-mark.svg') }}" type="image/svg+xml">

    <link rel="stylesheet" href="{{ asset('css/vuetify.min.css') }}">
    <link rel="stylesheet" href="{{ asset('icons/tabler-icons.min.css') }}">
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">

    {% block css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <script src="{{ asset('js/vue.min.js') }}"></script>
    <script src="{{ asset('js/vuetify.min.js') }}"></script>
    <script src="{{ asset('js/axios.min.js') }}"></script>
    <script src="{{ asset('js/config.js') }}"></script>
    {% block js %}{% endblock %}
</body>
</html>
