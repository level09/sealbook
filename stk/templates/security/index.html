{% extends "layout.html" %}
{% block content %}
<v-container class="py-6" style="max-width:960px">
  <h1 class="text-headline-small mb-5">{{ title }}</h1>
  <v-row>
    {% for name, href, icon in cards %}
    <v-col cols="12" sm="4">
      <v-card href="{{ href }}" class="pa-5 h-100">
        <i class="ti {{ icon }} text-medium-emphasis" style="font-size: 28px;"></i>
        <div class="text-title-medium mt-3">{{ name }}</div>
      </v-card>
    </v-col>
    {% endfor %}
  </v-row>
</v-container>
{% endblock %}
{% block js %}
<script>
const {createApp} = Vue;
window.app = createApp({mixins: [layoutMixin], delimiters: config.delimiters});
registerStkComponents(app); app.use(Vuetify.createVuetify(config.vuetifyConfig)).mount('#app');
</script>
{% endblock %}
