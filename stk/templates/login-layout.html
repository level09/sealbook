<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ config.APP_NAME }} - Security</title>
    <meta name="description" content="{{ config.APP_DESCRIPTION }}">
    <meta name="author" content="{{ config.APP_NAME }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ asset('img/sealbook-mark.svg') }}" type="image/svg+xml">

    <link rel="stylesheet" href="{{ asset('css/vuetify.min.css') }}">
    <link rel="stylesheet" href="{{ asset('icons/tabler-icons.min.css') }}">
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">

    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #app, .v-application, .v-application__wrap { min-height: 100vh; }
    </style>
    {% block css %}{% endblock %}
    {% block head_js %}{% endblock %}
</head>
<body>
<div id="app">
    <v-app v-cloak>
        {% block content %}{% endblock %}
    </v-app>
</div>

<script src="{{ asset('js/vue.min.js') }}"></script>
<script src="{{ asset('js/vuetify.min.js') }}"></script>
<script src="{{ asset('js/axios.min.js') }}"></script>
<script src="{{ asset('js/config.js') }}"></script>

<script>
    // Make config available globally for templates
    const delimiters = config.delimiters;
    const vuetifyConfig = config.vuetifyConfig;

    // Helper for handling API request errors
    function handleRequestError(error) {
        if (error.response && error.response.data) {
            const data = error.response.data;
            if (data.response && data.response.errors) {
                return Object.values(data.response.errors).flat().join(', ');
            }
            if (data.message) return data.message;
        }
        return error.message || 'An error occurred';
    }
</script>

{% block js %}{% endblock %}
</body>
</html>
