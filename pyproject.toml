[project]
name = "sealbook"
version = "0.2.0a0"
description = "AI-first evidence ledger"
authors = [
    {name = "Level09", email = "hello@level09.com"}
]
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"

dependencies = [
    "stkit>=17.1.0,<18",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23",
    "asn1crypto>=1.5.1",
    "pgvector>=0.4,<1",
    "pdqhash>=0.2,<1",
    "numpy>=2,<3",
    "pypdf>=6.21,<7",
    "pypdfium2>=5,<6",
    "faster-whisper==1.2.1",
    "openpyxl==3.1.5",
    "yt-dlp==2026.10.21",
    "playwright>=1.60.0",
]

[project.optional-dependencies]
full = ["stkit[full]"]  # PostgreSQL and Redis

[dependency-groups]
dev = ["stkit[dev]", "pypdf>=6.21.1"]

[tool.stk]
app = "sealbook.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sealbook"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Agent worktrees are full checkouts of other branches, not this tree's code.
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "C901",   # complexity
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sealbook"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.uv]
# Transitive (huggingface-hub); 4.2.1 fixes CVE-2026-112907, -112913 and -112940.
constraint-dependencies = ["filelock>=4.2.1"]
