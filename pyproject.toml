[project]
name = "sealbook"
version = "0.1.0"
description = "AI-first evidence ledger"
authors = [
    {name = "Level09", email = "hello@level09.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.16.0",
    "aiosmtplib>=5.0.0",
    "aiosqlite>=0.20.0",
    "authlib>=1.7.2,<2",
    "bcrypt>=4.3.0",
    "blinker>=1.9.0",
    "click>=8.3.1",
    "cryptography>=45.0.5",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.1,<2",
    "libpass>=1.9.0",
    "orjson>=3.10.18",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "qrcode>=8.2",
    "quart>=0.20.0",
    "quart-security>=2.0.1,<3",
    "quart-session>=3.0.0",
    "rich>=14.0.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn>=0.40.0",
    "webauthn>=2.6.0",
    "wtforms>=3.2.1",
    "asyncpg>=0.30.0",
    "jsonschema>=4.23",
    "asn1crypto>=1.5.1",
    "pgvector>=0.4,<1",
    "pdqhash>=0.2,<1",
    "numpy>=2,<3",
    "pypdf>=6.21,<7",
    "pypdfium2>=5,<6",
    "faster-whisper==1.2.1",
    "openpyxl==3.1.5",
    "yt-dlp==2026.10.21",
    "playwright>=1.60.0",
]


[project.scripts]
stk = "stk.cli.main:main"

# Overrides Quart's built-in `run` and `shell` (plugin commands win over built-ins).
[project.entry-points."quart.commands"]
run = "stk.cli:run"
shell = "stk.cli:shell"

[project.optional-dependencies]
full = [
    "asyncpg>=0.30.0",
    "redis>=7.1.0",
]
dev = [
    "ruff",
    "pre-commit",
    "ptpython>=3.0.30",
]
asgi = [
    "hypercorn>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit so an app can rename the project without breaking the build.
[tool.hatch.build.targets.wheel]
packages = ["stk"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Agent worktrees are full checkouts of other branches, not this tree's code.
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "C901",   # complexity
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/versions/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["stk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pypdf>=6.21.1",
]

[tool.uv]
# Transitive (huggingface-hub); 4.2.1 fixes CVE-2026-112907, -112913 and -112940.
constraint-dependencies = ["filelock>=4.2.1"]
