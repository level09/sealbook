<body><article><h1>مفقود: Yousef Khaled Al-Ali</h1><p>شوهد يوسف آخر مرة في دوما يوم 2013-05-02 عند خروجه من البيت صباحا.</p><p>عمره 22 عاما، طويل القامة، وكان يرتدي سترة زرقاء.</p><p>من لديه أي معلومة يرجى التواصل مع العائلة عبر هذه الصفحة.</p></article></body></html>
