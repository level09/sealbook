services:

  redis:
    container_name: redis 
    restart: unless-stopped
    image: 'redis:7-alpine'
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}

  postgres:
    container_name: postgres
    restart: unless-stopped
    build: ./postgres
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
      - './postgres/init-db.sh:/docker-entrypoint-initdb.d/10-stk.sh:ro'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:?Set a unique DB_ADMIN_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD:?Set a unique DB_PASSWORD}
      - POSTGRES_DB=stk
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "stk"]
      interval: 5s
      timeout: 3s
      retries: 3

  website:
    container_name: website
    restart: unless-stopped
    build: .
    volumes:
      # Evidence bytes (BLOB_DIR) and the speech model live under instance/.
      - 'instance-data:/app/instance'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m stk db upgrade && exec uvicorn sealbook.app:app --host 0.0.0.0 --port 5000 --ws-max-size 65536 --ws-max-queue 16 --proxy-headers --forwarded-allow-ips='*' --timeout-graceful-shutdown 3"]
    env_file:
      - .env
    environment: &app-env
      - QUART_DEBUG=0
      - STK_ENV=production
      - SESSION_COOKIE_SECURE=True
      - STK_PUBLIC_URL=https://${STK_HOST:?Set the public DNS name}
      - SECURITY_WAN_RP_ID=${STK_HOST:?Set the public DNS name}
      - SECURITY_WAN_EXPECTED_ORIGIN=https://${STK_HOST:?Set the public DNS name}
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://stk:${DB_PASSWORD:?Set a unique DB_PASSWORD}@postgres/stk
      - REDIS_SESSION=redis://:${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}@redis:6379/1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  runner:
    container_name: runner
    restart: unless-stopped
    build: .
    command: ["python", "-m", "stk", "runner"]
    volumes:
      - 'instance-data:/app/instance'
    depends_on:
      website:
        condition: service_healthy
    env_file:
      - .env
    environment: *app-env
    healthcheck:
      disable: true

  caddy:
    container_name: caddy
    restart: always
    image: 'caddy:2-alpine'
    ports:
      - '80:80'
      - '443:443'
    environment:
      - STK_HOST=${STK_HOST:?Set the public DNS name}
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy-data:/data'
      - 'caddy-config:/config'
    depends_on:
      - website

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  instance-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
